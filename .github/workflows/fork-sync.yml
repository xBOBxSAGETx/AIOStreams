# Fork-only workflow (xBOBxSAGETx/AIOStreams, branch `strand`). Not for upstream.
#
# Daily: merge upstream's newest nightly tag into `strand`.
#   clean merge + checks pass -> push `strand`, then build the image in this same run (fork-image.yml
#                                via workflow_call)
#   conflict / check fails    -> push NOTHING, open or update the "fork-sync: upstream merge blocked"
#                                issue; the last good :strand image stays
#
# Upstream source: `:nightly` is built by upstream deploy-docker.yml from the `<date>-nightly` tag that
# upstream nightly.yml creates on every qualifying push to `main`, so the tag (not `main`'s tip) is
# exactly what the upstream `:nightly` image contains.
#
# Credentials (why there are three jobs):
#   check   runs upstream code (pnpm install scripts, build, tests). It has a read-only GITHUB_TOKEN,
#           checks out with persist-credentials: false, fetches upstream anonymously and references
#           no secret, so no write credential exists anywhere in that job.
#   push    runs no upstream code. It re-does the same merge from the same base + tag, refuses unless
#           the tree equals the one `check` tested, and gets the PAT only as an env var of the push
#           step. Without the PAT it falls back to GITHUB_TOKEN (contents: write, this job only).
#   report  issues: write only.
#
# Needs (see the PR that added this file):
#   - `strand` as the repository's default branch (`schedule` and `workflow_dispatch` only run
#     workflows that exist on the default branch)
#   - Issues enabled (for the blocked-merge issue)
#   - secret STRAND_SYNC_TOKEN (fine-grained PAT, this repo only, Contents RW + Workflows RW) for
#     merges that change .github/workflows/**; without it those merges are reported, not pushed
name: Fork sync

on:
  schedule:
    # 08:17 UTC = 1:17 AM PDT / 12:17 AM PST. GitHub cron is UTC-only and Oregon shifts by 1 h at
    # DST, so 08:xx UTC is the only hour inside the owner's 12-2 AM Oregon band all year. One hour
    # after the Strand Discovery build (07:17 UTC). The VPS auto-update pulls at 12:00 Berlin
    # (10:00 UTC summer / 11:00 UTC winter = 3:00 AM Oregon): >= 1 h 43 min after this start; a
    # sync + image run takes ~6 min. A late run is harmless: the multi-arch tag is switched only by
    # the final manifest step, so the pull gets yesterday's image and the new one the next day.
    # Off the hour: `schedule` runs are delayed most at the start of every hour.
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Upstream nightly tag to merge (empty = newest)
        required: false
        type: string

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_URL: https://github.com/Viren070/AIOStreams.git
  MERGE_PREFIX: 'chore(fork-sync): merge upstream '
  ISSUE_TITLE: 'fork-sync: upstream merge blocked'
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  check:
    name: Merge and test (no write credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      current: ${{ steps.tag.outputs.current }}
      base: ${{ steps.tag.outputs.base }}
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: strand
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the upstream nightly
        id: tag
        env:
          INPUT_NIGHTLY: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          REASON="${RUNNER_TEMP}/reason.md"
          # Anonymous, read-only fetch of upstream's nightly tags; they are never pushed to the fork.
          git fetch --no-tags --quiet "${UPSTREAM_URL}" 'refs/tags/*-nightly:refs/tags/*-nightly'
          if [[ -n "${INPUT_NIGHTLY}" ]]; then
            TAG="${INPUT_NIGHTLY}"
          else
            # No `| head` here: under pipefail, head exits after one line, sort then dies of SIGPIPE once the
            # tag list exceeds the pipe buffer, and the step fails (run 36480189466). mapfile reads everything.
            mapfile -t TAGS < <(git tag -l '[0-9]*-nightly' | sort -r)
            TAG="${TAGS[0]:-}"
          fi
          if [[ -z "${TAG}" ]] || ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "Upstream nightly tag \`${TAG:-<none>}\` not found." > "${REASON}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "${TAG}" HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "strand already contains ${TAG}; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge the nightly into strand (local only)
        id: merge
        if: steps.tag.outputs.current != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          REASON="${RUNNER_TEMP}/reason.md"
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"
          if ! git merge --no-ff --no-edit -m "${MERGE_PREFIX}${TAG}" "${TAG}"; then
            {
              echo "Upstream nightly \`${TAG}\` does not merge cleanly into \`strand\`."
              echo
              echo "Conflicted files:"
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
            } > "${REASON}"
            git merge --abort
            exit 1
          fi
          # Recorded before any upstream code runs; the push job must reproduce exactly this tree.
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Refuse fork-only DB migrations
        if: steps.tag.outputs.current != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # After the merge, anything in the migrations dir that differs from the upstream tag exists
          # only in the fork. Such a migration makes the DB unusable for upstream builds
          # (migrations/runner.ts assertNotForeign / assertSchemaUpToDate) and blocks switching back.
          DIFF=$(git diff --name-status "${TAG}" HEAD -- packages/core/src/db/migrations/)
          if [[ -n "${DIFF}" ]]; then
            {
              echo "The merged tree has DB migration changes that upstream \`${TAG}\` does not have:"
              echo '```'
              echo "${DIFF}"
              echo '```'
              echo "The fork must not carry its own migrations (fork-run plan)."
            } > "${RUNNER_TEMP}/reason.md"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.tag.outputs.current != 'true'
        with:
          node-version: 24

      # Upstream's own PR gate (build.yml): install + build.
      - name: Install and build (upstream build.yml)
        if: steps.tag.outputs.current != 'true'
        run: |
          set -euo pipefail
          corepack enable
          if ! pnpm install --frozen-lockfile || ! pnpm run build; then
            echo "The merged tree does not install/build (\`pnpm install --frozen-lockfile && pnpm run build\`). See the run log." \
              > "${RUNNER_TEMP}/reason.md"
            exit 1
          fi

      # resources/metadata.json is git-ignored and only this script creates it (fork-image.yml runs it
      # before its build). Same call; the merge commit here is local, so its hash is not the one the push
      # job will publish (same tree). Without the file core only logs "Error loading metadata.json".
      - name: Generate metadata
        if: steps.tag.outputs.current != 'true'
        run: |
          set -euo pipefail
          node scripts/generateMetadata.cjs --channel=dev --ref="strand-$(git rev-parse --short=8 HEAD)" --commit="$(git rev-parse HEAD)"

      # Gate: every test file the fork adds or changes relative to upstream.
      # The tag is passed as NIGHTLY_TAG, not TAG: core's env.ts declares TAG (with VERSION, CHANNEL,
      # DESCRIPTION, GIT_COMMIT, BUILD_TIME, BUILD_COMMIT_TIME) as readonly, and a set TAG makes every
      # test that imports it exit 1 with "TAG: Readonly environment variable, cannot be set" (run 36480685376).
      - name: Tests for the fork's own changes
        if: steps.tag.outputs.current != 'true'
        env:
          NIGHTLY_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          FAILED=""
          mapfile -t CORE < <(git diff --name-only --diff-filter=AM "${NIGHTLY_TAG}" HEAD -- 'packages/core/**/*.test.ts' | sed 's#^packages/core/##')
          if (( ${#CORE[@]} )); then
            echo "core: ${CORE[*]}"
            (cd packages/core && pnpm exec tsx --test --test-force-exit --import ./test/setup.ts "${CORE[@]}") || FAILED="${FAILED} core"
          fi
          for pkg in frontend server; do
            mapfile -t FILES < <(git diff --name-only --diff-filter=AM "${NIGHTLY_TAG}" HEAD -- "packages/${pkg}/**/*.test.ts" "packages/${pkg}/**/*.test.tsx" | sed "s#^packages/${pkg}/##")
            if (( ${#FILES[@]} )); then
              echo "${pkg}: ${FILES[*]}"
              (cd "packages/${pkg}" && pnpm exec vitest run "${FILES[@]}") || FAILED="${FAILED} ${pkg}"
            fi
          done
          if [[ -n "${FAILED}" ]]; then
            echo "The fork's own tests fail on the merged tree:${FAILED}. See the run log." > "${RUNNER_TEMP}/reason.md"
            exit 1
          fi

      # Advisory only: upstream does not gate on its unit tests, and core has a known failing test
      # upstream (remuxdb/adapter.test.ts "maps audio and subtitle tracks" at 1c6f2c0c).
      - name: Full core test suite (advisory)
        if: steps.tag.outputs.current != 'true'
        continue-on-error: true
        run: pnpm -F core test

      - name: Upload the failure reason
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-sync-reason
          path: ${{ runner.temp }}/reason.md
          if-no-files-found: ignore
          retention-days: 7

  push:
    name: Push strand
    needs: check
    if: needs.check.outputs.current != 'true'
    runs-on: ubuntu-latest
    permissions:
      # Used only by the no-PAT fallback push (GITHUB_TOKEN). With STRAND_SYNC_TOKEN set it is unused.
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-do the tested merge
        env:
          TAG: ${{ needs.check.outputs.tag }}
          TREE: ${{ needs.check.outputs.tree }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet "${UPSTREAM_URL}" "refs/tags/${TAG}:refs/tags/${TAG}"
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"
          git merge --no-ff --no-edit -m "${MERGE_PREFIX}${TAG}" "${TAG}"
          GOT=$(git rev-parse 'HEAD^{tree}')
          if [[ -z "${TREE}" || "${GOT}" != "${TREE}" ]]; then
            echo "The re-done merge (tree ${GOT}) differs from the tested one (tree ${TREE:-<none>}); refusing to push." \
              > "${RUNNER_TEMP}/reason.md"
            exit 1
          fi

      - name: Check the push credential
        env:
          HAS_PAT: ${{ secrets.STRAND_SYNC_TOKEN != '' }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD^1 HEAD -- .github/workflows/)
          if [[ -n "${CHANGED}" && "${HAS_PAT}" != "true" ]]; then
            {
              echo "Upstream \`${TAG}\` changes workflow files, which \`GITHUB_TOKEN\` may not push:"
              echo '```'
              echo "${CHANGED}"
              echo '```'
              echo "Add the \`STRAND_SYNC_TOKEN\` secret (fine-grained PAT: this repository only;"
              echo "Contents read/write + Workflows read/write) and re-run **Fork sync**."
            } > "${RUNNER_TEMP}/reason.md"
            exit 1
          fi

      # The only step that sees a write credential. It is passed in the URL for this one command,
      # never written to git config or disk, never echoed (and masked in logs by the runner).
      - name: Push strand
        id: push
        env:
          PAT: ${{ secrets.STRAND_SYNC_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set +x
          set -euo pipefail
          TOKEN="${PAT:-${FALLBACK_TOKEN}}"
          if ! git push --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/strand; then
            echo "Pushing \`strand\` failed (did it move during the run, or is the token missing a permission?). See the run log." \
              > "${RUNNER_TEMP}/reason.md"
            exit 1
          fi
          unset TOKEN PAT FALLBACK_TOKEN
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Merged ${TAG} into strand as $(git rev-parse --short=8 HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the failure reason
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-sync-reason
          path: ${{ runner.temp }}/reason.md
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: [check, push]
    if: always() && (needs.check.result == 'failure' || needs.push.result == 'failure' || needs.push.outputs.pushed == 'true')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download the failure reason
        if: needs.push.outputs.pushed != 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-sync-reason
          path: ${{ runner.temp }}/reason

      - name: Open or update the blocked-merge issue
        if: needs.push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          REASON="${RUNNER_TEMP}/reason/reason.md"
          [[ -s "${REASON}" ]] || { mkdir -p "$(dirname "${REASON}")"; echo "The sync failed before it could record a reason. See the run log." > "${REASON}"; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            cat "${REASON}"
            echo
            echo "Nothing was pushed or built; \`:strand\` still points at the last good image. Run: ${RUN_URL}"
            echo
            echo "To fix by hand: \`git fetch https://github.com/Viren070/AIOStreams.git tag ${TAG:-<tag>}\`,"
            echo "\`git checkout strand && git merge ${TAG:-<tag>}\`, resolve, push \`strand\` (or open a PR into it)."
            echo "A push to \`strand\` builds the image. Use a commit message that does not start with"
            echo "\`${MERGE_PREFIX}\`, or run **Fork image** by hand afterwards."
          } > "${RUNNER_TEMP}/body.md"
          cat "${RUNNER_TEMP}/body.md" >> "$GITHUB_STEP_SUMMARY"
          OPEN=$(gh issue list -R "${GITHUB_REPOSITORY}" -s open --search "in:title \"${ISSUE_TITLE}\"" --json number,title \
                 --jq "[.[] | select(.title == \"${ISSUE_TITLE}\")][0].number // empty") || OPEN=""
          if [[ -n "${OPEN}" ]]; then
            gh issue comment "${OPEN}" -R "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/body.md" \
              || echo "::warning::Could not comment on issue #${OPEN}."
          else
            gh issue create -R "${GITHUB_REPOSITORY}" -t "${ISSUE_TITLE}" --body-file "${RUNNER_TEMP}/body.md" \
              || echo "::warning::Could not open an issue (are Issues enabled on the fork?)."
          fi

      - name: Close the blocked-merge issue
        if: needs.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          for n in $(gh issue list -R "${GITHUB_REPOSITORY}" -s open --search "in:title \"${ISSUE_TITLE}\"" --json number,title \
                     --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number"); do
            gh issue close "${n}" -R "${GITHUB_REPOSITORY}" -c "Merged \`${TAG}\` cleanly; image build started in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          done

  image:
    name: Build the image
    needs: push
    if: needs.push.outputs.pushed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/fork-image.yml
    with:
      ref: ${{ needs.push.outputs.sha }}

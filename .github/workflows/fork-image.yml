# Fork-only workflow (xBOBxSAGETx/AIOStreams, branch `strand`). Not for upstream.
#
# Builds the `strand` branch and pushes it to ghcr.io/<owner>/aiostreams as
#   :strand            moving tag, only moved when the built commit is still the tip of `strand`
#   :strand-<sha8>     immutable, for rollback and for reviewed_digests.txt
#
# Structure copied from upstream's deploy-docker.yml / dev-docker.yml (setup -> per-arch build pushed
# by digest on native runners -> manifest merge). Docker Hub and Discord are left out.
#
# Triggers:
#   push to strand     a human merge (e.g. a PR into strand). Skipped for the sync's own merge
#                      commits, because fork-sync.yml builds those itself through workflow_call.
#   workflow_dispatch  manual rebuild.
#   workflow_call      from fork-sync.yml, after it pushed a clean upstream merge.
name: Fork image

on:
  push:
    branches: [strand]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on strand to build (empty = tip of the selected branch)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Commit on strand to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    name: Resolve commit
    # The sync's merge commits are built by fork-sync.yml itself. If that push was made with a PAT it
    # also fires this push trigger; skip it so each commit is built once (same guard shape as
    # upstream nightly.yml's `!startsWith(github.event.head_commit.message, 'chore: release ')`).
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(fork-sync): merge upstream ') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      image: ${{ steps.resolve.outputs.image }}
      nightly: ${{ steps.resolve.outputs.nightly }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve commit, image name and upstream base
        id: resolve
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=8 HEAD)

          # Only commits that are on strand may become a strand image.
          if ! git merge-base --is-ancestor "${SHA}" origin/strand; then
            echo "::error::${SHA} is not on strand; refusing to build a strand image from it."
            exit 1
          fi

          # Newest upstream nightly tag contained in this commit (recorded as a label, used by the
          # VPS pre-flight to compare migration sets). Tags are fetched from upstream read-only.
          git fetch --no-tags --quiet https://github.com/Viren070/AIOStreams.git \
            'refs/tags/*-nightly:refs/tags/*-nightly'
          NIGHTLY=none
          for t in $(git tag -l '[0-9]*-nightly' | sort -r); do
            if git merge-base --is-ancestor "${t}" "${SHA}"; then NIGHTLY="${t}"; break; fi
          done

          IMAGE="ghcr.io/${OWNER,,}/aiostreams"
          {
            echo "sha=${SHA}"
            echo "short=${SHORT}"
            echo "image=${IMAGE}"
            echo "nightly=${NIGHTLY}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${SHA} (upstream base ${NIGHTLY}) -> ${IMAGE}"

  build:
    name: build (${{ matrix.suffix }})
    needs: setup
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.sha }}
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Same call as upstream dev-docker.yml: the fork has no upstream tags, so the channel is `dev`
      # with an explicit tag instead of `nightly` (whose tag comes from `git describe --tags`).
      - name: Generate metadata
        env:
          SHORT: ${{ needs.setup.outputs.short }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: node scripts/generateMetadata.cjs --channel=dev --ref="strand-${SHORT}" --commit="${SHA}"

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          context: .
          file: ./Dockerfile
          outputs: type=image,name=${{ needs.setup.outputs.image }},push-by-digest=true,name-canonical=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}
            win.tvtunnel.upstream-nightly=${{ needs.setup.outputs.nightly }}
          cache-from: type=gha,scope=strand-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=strand-${{ matrix.suffix }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: echo "${DIGEST}" > "/tmp/${SUFFIX}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: '{amd64,arm64}'
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifests
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.setup.outputs.image }}
          SHA: ${{ needs.setup.outputs.sha }}
          SHORT: ${{ needs.setup.outputs.short }}
          NIGHTLY: ${{ needs.setup.outputs.nightly }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAGS=("strand-${SHORT}")
          # Move :strand only if this commit is still the tip, so an older build that finishes late
          # can't overwrite a newer one.
          TIP=$(gh api "repos/${REPO}/commits/strand" --jq .sha)
          if [[ "${TIP}" == "${SHA}" ]]; then
            TAGS+=("strand")
          else
            echo "::warning::strand moved to ${TIP} during the build; pushing only strand-${SHORT}."
          fi

          ARGS=()
          TAG_LIST=""
          for tag in "${TAGS[@]}"; do
            ARGS+=(--tag "${IMAGE}:${tag}")
            TAG_LIST="${TAG_LIST} \`${IMAGE}:${tag}\`"
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${REPO}" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "index:win.tvtunnel.upstream-nightly=${NIGHTLY}" \
            "${ARGS[@]}" \
            "${IMAGE}@$(cat /tmp/digests/amd64)" \
            "${IMAGE}@$(cat /tmp/digests/arm64)"

          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:strand-${SHORT}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Fork image"
            echo "- commit: \`${SHA}\` (upstream base \`${NIGHTLY}\`)"
            echo "- tags:${TAG_LIST}"
            echo "- index digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
